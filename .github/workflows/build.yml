name: TrendinShop build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/trendinshop_ci
      MONGODB_DB: trendinshop_ci
      AUTH_SECRET: ci-only-auth-secret-for-build
      ADMIN_BOOTSTRAP_KEY: ci-only-bootstrap-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
